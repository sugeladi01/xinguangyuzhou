<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 · 校园正能量</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&family=LXGW+WenKai&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tools.css">
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <nav id="global-nav">
        <div class="nav-inner">
            <a class="nav-logo" href="index.html"><i class="fas fa-atom"></i> 正能量</a>
            <a class="nav-link" href="index.html"><i class="fas fa-home"></i> 首页</a>
            <a class="nav-link" href="index.html"><i class="fas fa-yin-yang"></i> 心学</a>
            <a class="nav-link" href="index.html"><i class="fas fa-flask"></i> 科学</a>
            <a class="nav-link" href="index.html"><i class="fas fa-star"></i> 分享</a>
            <div class="nav-divider"></div>
            <a class="nav-link" href="tools.html"><i class="fas fa-tools"></i> 工具</a>
            <a class="nav-link" href="seminar.html"><i class="fas fa-comments"></i> 研讨</a>
            <a class="nav-link active" href="message.html"><i class="fas fa-paper-plane"></i> 留言</a>
        </div>
    </nav>

    <div class="tool-page-body">
        <div class="tool-page">
            <div class="page-header">
                <h1><i class="fas fa-paper-plane"></i> 留言板</h1>
                <p>在这里留下你的思考、感悟或祝福，让正能量在校园中传递</p>
            </div>

            <!-- Post Message Form -->
            <div class="tool-card" style="max-width:800px;margin:0 auto 2rem;" id="msg-form-card">
                <h3>留下你的心声</h3>
                <div id="msg-login-hint" style="display:none;margin-bottom:1rem;padding:0.8rem 1rem;border-radius:10px;background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.1);font-size:0.82rem;color:#b0aca4;">
                    <i class="fas fa-info-circle" style="color:#e0c868;margin-right:6px;"></i>
                    发布留言需要先 <a href="javascript:void(0)" onclick="showLoginModal()" style="color:#e0c868;text-decoration:underline;">登录</a>
                </div>
                <div id="msg-form-fields">
                    <div class="form-group" id="msg-name-group">
                        <label>昵称</label>
                        <input type="text" class="form-input" id="msg-name" placeholder="你的名字...">
                    </div>
                    <div class="form-group">
                        <label>留言内容</label>
                        <textarea class="form-textarea" id="msg-content" placeholder="写下你的思考、感悟或祝福..."></textarea>
                    </div>
                    <button class="btn btn-gold" id="msg-submit" style="width:100%;">
                        <i class="fas fa-paper-plane"></i> 发布留言
                    </button>
                </div>
            </div>

            <!-- 管理员控制面板 -->
            <div id="admin-panel" style="display:none;max-width:800px;margin:0 auto 1rem;padding:1rem;background:rgba(201,168,76,0.05);border:1px solid rgba(201,168,76,0.15);border-radius:12px;">
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
                    <span style="font-size:0.85rem;color:#e0c868;font-weight:600;">🔧 管理员控制面板</span>
                    <div style="display:flex;align-items:center;gap:12px;">
                        <button onclick="showChangePasswordModal()" style="padding:5px 12px;border-radius:8px;border:1px solid rgba(201,168,76,0.2);background:rgba(201,168,76,0.06);color:#e0c868;font-size:0.78rem;cursor:pointer;font-family:'LXGW WenKai',sans-serif;">🔑 修改密码</button>
                        <label style="display:flex;align-items:center;gap:6px;font-size:0.78rem;color:#b0aca4;cursor:pointer;">
                            <input type="checkbox" id="register-toggle" onchange="toggleRegisterSwitch()" style="cursor:pointer;">
                            允许新用户注册
                        </label>
                    </div>
                </div>
            </div>

            <!-- Message Timeline -->
            <div style="max-width:800px;margin:0 auto;">
                <div class="message-timeline" id="msg-timeline">
                    <div style="text-align:center;padding:2rem;color:#8a8680;">
                        <i class="fas fa-spinner fa-spin" style="font-size:1.2rem;"></i>
                        <p style="margin-top:0.5rem;">加载留言中...</p>
                    </div>
                </div>
                <div id="load-more-wrap" style="text-align:center;padding:1rem 0;display:none;">
                    <button id="load-more-btn" onclick="loadMoreMessages()" style="padding:8px 28px;border-radius:12px;border:1px solid rgba(201,168,76,0.2);background:rgba(201,168,76,0.06);color:#e0c868;font-size:0.82rem;cursor:pointer;font-family:'LXGW WenKai',sans-serif;">加载更多留言</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/particles.js"></script>
    <script src="js/api.js"></script>
    <script>
        // ===== 分页状态 =====
        let msgPage = 1;
        let msgTotalPages = 1;
        const MSG_PAGE_SIZE = 15;
        let isUserAdmin = false; // 服务端验证的管理员状态

        // ===== 从服务端验证管理员状态 =====
        async function verifyAdminStatus() {
            if (!TokenManager.isLoggedIn()) {
                isUserAdmin = false;
                return;
            }
            try {
                const res = await AuthAPI.getProfile();
                if (res.code === 200 && res.data) {
                    isUserAdmin = !!(res.data.is_admin);
                    // 同步更新 localStorage
                    const user = TokenManager.getUser();
                    if (user) {
                        user.is_admin = res.data.is_admin;
                        TokenManager.setUser(user);
                    }
                } else {
                    isUserAdmin = false;
                }
            } catch (e) {
                // 网络异常时回退到 localStorage
                isUserAdmin = TokenManager.isAdmin();
            }
        }

        // ===== 加载留言列表 =====
        async function loadMessages(reset = true) {
            const timeline = document.getElementById('msg-timeline');
            const loadMoreWrap = document.getElementById('load-more-wrap');
            if (reset) {
                msgPage = 1;
                timeline.innerHTML = '<div style="text-align:center;padding:2rem;color:#8a8680;"><i class="fas fa-spinner fa-spin" style="font-size:1.2rem;"></i><p style="margin-top:0.5rem;">加载留言中...</p></div>';
            }
            try {
                const res = await MessagesAPI.getList(msgPage, MSG_PAGE_SIZE);
                if (res.code === 200 && res.data && res.data.list) {
                    const list = res.data.list;
                    const pagination = res.data.pagination;
                    msgTotalPages = pagination ? pagination.totalPages : 1;
                    if (reset) {
                        if (list.length === 0) {
                            timeline.innerHTML = '<div style="text-align:center;padding:2rem;color:#8a8680;">暂无留言，来留下第一条吧 ✨</div>';
                            loadMoreWrap.style.display = 'none';
                            return;
                        }
                        timeline.innerHTML = '';
                    }
                    const html = list.map((msg, idx) => {
                        const d = new Date(msg.created_at);
                        const timeStr = d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · '+d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
                        const isAdmin = isUserAdmin;
                        const isOwner = TokenManager.getUser() && TokenManager.getUser().id === msg.user_id;
                        const isBlocked = msg.author_is_blocked;
                        const isAuthorAdmin = msg.author_is_admin;
                        let adminButtons = '';
                        if (isAdmin && !isOwner && !isAuthorAdmin) {
                            if (isBlocked) {
                                adminButtons = '<div class="msg-admin-actions" style="margin-top:8px;display:flex;gap:8px;"><button onclick="adminDeleteMessage('+msg.id+')" style="padding:4px 10px;border-radius:8px;border:1px solid rgba(224,96,80,0.2);background:rgba(224,96,80,0.06);color:#e06050;font-size:0.72rem;cursor:pointer;font-family:\'LXGW WenKai\',sans-serif;">🗑 删除留言</button><button onclick="adminUnblockUser('+msg.user_id+')" style="padding:4px 10px;border-radius:8px;border:1px solid rgba(80,200,120,0.2);background:rgba(80,200,120,0.06);color:#50c878;font-size:0.72rem;cursor:pointer;font-family:\'LXGW WenKai\',sans-serif;">✓ 解封用户</button></div>';
                            } else {
                                adminButtons = '<div class="msg-admin-actions" style="margin-top:8px;display:flex;gap:8px;"><button onclick="adminDeleteMessage('+msg.id+')" style="padding:4px 10px;border-radius:8px;border:1px solid rgba(224,96,80,0.2);background:rgba(224,96,80,0.06);color:#e06050;font-size:0.72rem;cursor:pointer;font-family:\'LXGW WenKai\',sans-serif;">🗑 删除留言</button><button onclick="adminBlockUser('+msg.user_id+')" style="padding:4px 10px;border-radius:8px;border:1px solid rgba(201,168,76,0.15);background:rgba(201,168,76,0.06);color:#e0c868;font-size:0.72rem;cursor:pointer;font-family:\'LXGW WenKai\',sans-serif;">🚫 拉黑用户</button></div>';
                            }
                        } else if (isAdmin && isOwner) {
                            adminButtons = '<div class="msg-admin-actions" style="margin-top:8px;display:flex;gap:8px;"><button onclick="adminDeleteMessage('+msg.id+')" style="padding:4px 10px;border-radius:8px;border:1px solid rgba(224,96,80,0.2);background:rgba(224,96,80,0.06);color:#e06050;font-size:0.72rem;cursor:pointer;font-family:\'LXGW WenKai\',sans-serif;">🗑 删除留言</button></div>';
                        }
                        let badges = '';
                        if (isAuthorAdmin) badges += ' <span style="font-size:0.65rem;padding:1px 6px;border-radius:6px;background:rgba(201,168,76,0.15);color:#e0c868;margin-left:6px;">管理员</span>';
                        if (isBlocked) badges += ' <span style="font-size:0.65rem;padding:1px 6px;border-radius:6px;background:rgba(224,96,80,0.1);color:#e06050;margin-left:4px;">已拉黑</span>';
                        return '<div class="message-item" data-message-id="'+msg.id+'"><div class="msg-author">'+(msg.nickname||'匿名')+badges+'</div><div class="msg-time">'+timeStr+'</div><div class="msg-content">'+escapeHtml(msg.content)+'</div>'+adminButtons+'</div>';
                    }).join('');
                    timeline.insertAdjacentHTML('beforeend', html);
                    // 显示/隐藏加载更多
                    if (msgPage < msgTotalPages) {
                        loadMoreWrap.style.display = 'block';
                    } else {
                        loadMoreWrap.style.display = 'none';
                    }
                    if (reset) {
                        gsap.fromTo('.message-item', { opacity: 0, y: -15 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.06, ease: 'power2.out' });
                    } else {
                        // 加载更多：仅淡入，不移动位置，避免空白间隙
                        const allItems = timeline.querySelectorAll('.message-item');
                        const newItems = Array.from(allItems).slice(-list.length);
                        gsap.fromTo(newItems, { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.06, ease: 'power2.out' });
                    }
                } else if (reset) {
                    timeline.innerHTML = '<div style="text-align:center;padding:2rem;color:#8a8680;">加载失败，请刷新重试</div>';
                }
            } catch (err) {
                if (reset) timeline.innerHTML = '<div style="text-align:center;padding:2rem;color:#8a8680;">网络错误，请检查连接</div>';
            }
        }

        async function loadMoreMessages() {
            msgPage++;
            const btn = document.getElementById('load-more-btn');
            btn.disabled = true;
            btn.textContent = '加载中...';
            await loadMessages(false);
            btn.disabled = false;
            btn.textContent = '加载更多留言';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== 更新登录状态显示 =====
        function updateMsgLoginState() {
            const user = TokenManager.getUser();
            const loginHint = document.getElementById('msg-login-hint');
            const nameGroup = document.getElementById('msg-name-group');
            if (user) {
                loginHint.style.display = 'none';
                nameGroup.style.display = 'none';
                document.getElementById('msg-name').value = user.nickname || user.username || '';
            } else {
                loginHint.style.display = 'block';
                nameGroup.style.display = 'block';
            }
        }

        // ===== 登录弹窗 =====
        function showLoginModal() {
            // 如果已有弹窗就移除
            const existing = document.getElementById('login-modal');
            if (existing) existing.remove();

            const modal = document.createElement('div');
            modal.id = 'login-modal';
            modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:flex;justify-content:center;align-items:center;backdrop-filter:blur(8px);';
            modal.innerHTML = `
                <div style="width:90%;max-width:380px;background:#14142c;border:1px solid rgba(201,168,76,0.2);border-radius:20px;padding:2rem;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
                        <h3 style="font-family:'ZCOOL XiaoWei',serif;color:#fff;font-size:1.1rem;">登录 · 心光宇宙</h3>
                        <button onclick="document.getElementById('login-modal').remove()" style="width:28px;height:28px;border-radius:50%;border:1px solid rgba(201,168,76,0.15);background:transparent;color:#b0aca4;cursor:pointer;font-size:0.75rem;">✕</button>
                    </div>
                    <div id="login-tab-row" style="display:flex;gap:0;margin-bottom:1.2rem;background:rgba(14,14,35,0.6);border-radius:12px;padding:3px;">
                        <button class="login-tab active" onclick="switchLoginTab('login')" style="flex:1;padding:8px;border-radius:10px;border:none;background:rgba(201,168,76,0.1);color:#e0c868;font-family:'LXGW WenKai',sans-serif;font-size:0.82rem;cursor:pointer;">登录</button>
                        <button id="register-tab-btn" class="login-tab" onclick="switchLoginTab('register')" style="flex:1;padding:8px;border-radius:10px;border:none;background:transparent;color:#8a8680;font-family:'LXGW WenKai',sans-serif;font-size:0.82rem;cursor:pointer;">注册</button>
                        <button id="email-tab-btn" class="login-tab" onclick="switchLoginTab('email')" style="flex:1;padding:8px;border-radius:10px;border:none;background:transparent;color:#8a8680;font-family:'LXGW WenKai',sans-serif;font-size:0.82rem;cursor:pointer;">邮箱</button>
                    </div>
                    <div id="login-form">
                        <div id="email-username-row" style="margin-bottom:0.8rem;">
                            <label style="display:block;font-size:0.72rem;color:#b0aca4;margin-bottom:4px;">用户名</label>
                            <input type="text" id="login-username" placeholder="输入用户名" style="width:100%;padding:10px 14px;border-radius:12px;border:1px solid rgba(201,168,76,0.12);background:rgba(10,10,25,0.6);color:#e8e4dc;font-family:'LXGW WenKai',sans-serif;font-size:0.82rem;outline:none;">
                        </div>
                        <div id="email-input-row" style="margin-bottom:0.8rem;display:none;">
                            <label style="display:block;font-size:0.72rem;color:#b0aca4;margin-bottom:4px;">邮箱</label>
                            <div style="display:flex;gap:8px;">
                                <input type="email" id="email-input" placeholder="输入邮箱地址" style="flex:1;padding:10px 14px;border-radius:12px;border:1px solid rgba(201,168,76,0.12);background:rgba(10,10,25,0.6);color:#e8e4dc;font-family:'LXGW WenKai',sans-serif;font-size:0.82rem;outline:none;">
                                <button id="send-code-btn" onclick="sendVerificationCode()" style="padding:10px 14px;border-radius:12px;border:1px solid rgba(201,168,76,0.2);background:rgba(201,168,76,0.08);color:#e0c868;font-size:0.75rem;cursor:pointer;white-space:nowrap;font-family:'LXGW WenKai',sans-serif;">发送验证码</button>
                            </div>
                        </div>
                        <div id="code-input-row" style="margin-bottom:0.8rem;display:none;">
                            <label style="display:block;font-size:0.72rem;color:#b0aca4;margin-bottom:4px;">验证码</label>
                            <input type="text" id="email-code" placeholder="输入邮箱验证码" maxlength="6" style="width:100%;padding:10px 14px;border-radius:12px;border:1px solid rgba(201,168,76,0.12);background:rgba(10,10,25,0.6);color:#e8e4dc;font-family:'LXGW WenKai',sans-serif;font-size:0.82rem;outline:none;">
                        </div>
                        <div id="password-row" style="margin-bottom:0.8rem;">
                            <label id="password-label" style="display:block;font-size:0.72rem;color:#b0aca4;margin-bottom:4px;">密码</label>
                            <input type="password" id="login-password" placeholder="输入密码" style="width:100%;padding:10px 14px;border-radius:12px;border:1px solid rgba(201,168,76,0.12);background:rgba(10,10,25,0.6);color:#e8e4dc;font-family:'LXGW WenKai',sans-serif;font-size:0.82rem;outline:none;">
                        </div>
                        <div id="register-nickname-row" style="margin-bottom:0.8rem;display:none;">
                            <label style="display:block;font-size:0.72rem;color:#b0aca4;margin-bottom:4px;">昵称</label>
                            <input type="text" id="register-nickname" placeholder="你的昵称" style="width:100%;padding:10px 14px;border-radius:12px;border:1px solid rgba(201,168,76,0.12);background:rgba(10,10,25,0.6);color:#e8e4dc;font-family:'LXGW WenKai',sans-serif;font-size:0.82rem;outline:none;">
                        </div>
                        <div id="login-error" style="display:none;margin-bottom:0.8rem;padding:6px 10px;border-radius:8px;background:rgba(224,96,80,0.1);border:1px solid rgba(224,96,80,0.2);color:#e06050;font-size:0.78rem;"></div>
                        <div id="login-success" style="display:none;margin-bottom:0.8rem;padding:6px 10px;border-radius:8px;background:rgba(80,200,120,0.1);border:1px solid rgba(80,200,120,0.2);color:#50c878;font-size:0.78rem;"></div>
                        <button id="login-submit-btn" onclick="handleLogin()" style="width:100%;padding:10px;border-radius:12px;border:none;background:linear-gradient(135deg,#e0c868,#c89030);color:#0a0a10;font-family:'LXGW WenKai',sans-serif;font-size:0.85rem;font-weight:600;cursor:pointer;">登录</button>
                    </div>
                </div>
            `;
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
            document.body.appendChild(modal);
        }

        let currentLoginTab = 'login';
        function switchLoginTab(tab) {
            currentLoginTab = tab;
            const tabs = document.querySelectorAll('.login-tab');
            const tabNames = ['login', 'register', 'email'];
            tabs.forEach((t, i) => {
                const isActive = tabNames[i] === tab;
                t.style.background = isActive ? 'rgba(201,168,76,0.1)' : 'transparent';
                t.style.color = isActive ? '#e0c868' : '#8a8680';
            });
            // 用户名栏：邮箱tab隐藏
            document.getElementById('email-username-row').style.display = tab === 'email' ? 'none' : 'block';
            // 邮箱栏：邮箱tab显示
            document.getElementById('email-input-row').style.display = tab === 'email' ? 'block' : 'none';
            // 验证码栏：邮箱tab显示
            document.getElementById('code-input-row').style.display = tab === 'email' ? 'block' : 'none';
            // 密码栏：邮箱tab可选(隐藏)
            document.getElementById('password-row').style.display = tab === 'email' ? 'none' : 'block';
            // 昵称栏：注册tab显示
            document.getElementById('register-nickname-row').style.display = tab === 'register' ? 'block' : 'none';
            // 按钮文字
            const btn = document.getElementById('login-submit-btn');
            if (tab === 'login') btn.textContent = '登录';
            else if (tab === 'register') btn.textContent = '注册';
            else btn.textContent = '邮箱登录 / 注册';
            // 清除错误
            document.getElementById('login-error').style.display = 'none';
            document.getElementById('login-success').style.display = 'none';
        }

        async function sendVerificationCode() {
            const email = document.getElementById('email-input').value.trim();
            const btn = document.getElementById('send-code-btn');
            const errorEl = document.getElementById('login-error');
            const successEl = document.getElementById('login-success');
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            if (!email) { errorEl.textContent = '请输入邮箱地址'; errorEl.style.display = 'block'; return; }
            btn.disabled = true;
            btn.textContent = '发送中...';
            try {
                const res = await AuthAPI.sendCode(email);
                if (res.code === 200) {
                    successEl.textContent = res.message;
                    successEl.style.display = 'block';
                    // 倒计时60秒
                    let sec = 60;
                    const timer = setInterval(() => {
                        sec--;
                        btn.textContent = sec + '秒后重发';
                        if (sec <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '发送验证码'; }
                    }, 1000);
                } else {
                    errorEl.textContent = res.message;
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = '发送验证码';
                }
            } catch (e) {
                errorEl.textContent = '网络错误，请稍后重试';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '发送验证码';
            }
        }

        async function handleLogin() {
            const errorEl = document.getElementById('login-error');
            const successEl = document.getElementById('login-success');
            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            let res;
            if (currentLoginTab === 'email') {
                const email = document.getElementById('email-input').value.trim();
                const code = document.getElementById('email-code').value.trim();
                if (!email) { errorEl.textContent = '请输入邮箱地址'; errorEl.style.display = 'block'; return; }
                if (!code) { errorEl.textContent = '请输入验证码'; errorEl.style.display = 'block'; return; }
                res = await AuthAPI.emailLogin(email, code);
            } else {
                const username = document.getElementById('login-username').value.trim();
                const password = document.getElementById('login-password').value;
                if (!username || !password) { errorEl.textContent = '请填写用户名和密码'; errorEl.style.display = 'block'; return; }
                if (currentLoginTab === 'login') {
                    res = await AuthAPI.login(username, password);
                } else {
                    const nickname = document.getElementById('register-nickname').value.trim();
                    if (!nickname) { errorEl.textContent = '请填写昵称'; errorEl.style.display = 'block'; return; }
                    if (password.length < 6) { errorEl.textContent = '密码至少6位'; errorEl.style.display = 'block'; return; }
                    res = await AuthAPI.register(username, password, nickname);
                }
            }

            if (res.code === 200 || res.code === 201) {
                document.getElementById('login-modal').remove();
                updateMsgLoginState();
                await verifyAdminStatus();
                await loadMessages();
                checkRegisterStatus();
                if (isUserAdmin) {
                    const panel = document.getElementById('admin-panel');
                    if (panel) panel.style.display = 'block';
                }
            } else {
                errorEl.textContent = res.message || '操作失败，请重试';
                errorEl.style.display = 'block';
            }
        }

        // ===== 发布留言 =====
        document.getElementById('msg-submit')?.addEventListener('click', async () => {
            const content = document.getElementById('msg-content').value.trim();
            if (!content) { alert('请输入留言内容'); return; }

            if (!TokenManager.isLoggedIn()) {
                showLoginModal();
                return;
            }

            const btn = document.getElementById('msg-submit');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 发布中...';

            const res = await MessagesAPI.create(content);
            if (res.code === 201) {
                document.getElementById('msg-content').value = '';
                loadMessages(); // 重新加载
                btn.innerHTML = '<i class="fas fa-check"></i> 发布成功';
                setTimeout(() => { btn.innerHTML = '<i class="fas fa-paper-plane"></i> 发布留言'; btn.disabled = false; }, 1500);
            } else {
                alert(res.message || '发布失败，请重试');
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> 发布留言';
                btn.disabled = false;
            }
        });

        // ===== 查询注册状态 =====
        async function checkRegisterStatus() {
            try {
                const res = await SettingsAPI.getRegisterStatus();
                if (res.code === 200) {
                    const enabled = res.data.register_enabled;
                    const regBtn = document.getElementById('register-tab-btn');
                    if (regBtn) {
                        regBtn.style.display = enabled ? 'block' : 'none';
                    }
                    // 同步管理员面板开关
                    const toggle = document.getElementById('register-toggle');
                    if (toggle) toggle.checked = enabled;
                }
            } catch (e) {
                console.error('查询注册状态失败', e);
            }
        }

        // ===== 切换注册开关（管理员） =====
        async function toggleRegisterSwitch() {
            const toggle = document.getElementById('register-toggle');
            const enabled = toggle.checked;
            try {
                const res = await SettingsAPI.toggleRegister(enabled);
                if (res.code === 200) {
                    alert(res.message);
                    // 刷新页面以应用新状态
                    location.reload();
                } else {
                    alert(res.message || '操作失败');
                    toggle.checked = !enabled;
                }
            } catch (e) {
                alert('网络错误');
                toggle.checked = !enabled;
            }
        }

        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', async () => {
            updateMsgLoginState();
            // 先验证管理员状态
            await verifyAdminStatus();
            await loadMessages();
            checkRegisterStatus();

            // 如果是管理员，显示控制面板
            if (isUserAdmin) {
                const panel = document.getElementById('admin-panel');
                if (panel) panel.style.display = 'block';
            }
        });
    </script>

<script>
// ===== 管理员操作 =====
async function adminDeleteMessage(messageId) {
    if (!confirm('确定要删除这条留言吗？')) return;
    try {
        const res = await AdminAPI.deleteMessage(messageId);
        if (res.code === 200) {
            // 直接从 DOM 移除，不重新加载，保持滚动位置
            const el = document.querySelector('.message-item[data-message-id="'+messageId+'"]');
            if (el) {
                gsap.to(el, { opacity: 0, height: 0, marginBottom: 0, paddingTop: 0, paddingBottom: 0, duration: 0.3, onComplete: function() { el.remove(); } });
            }
            // 如果当前页没有留言了，重新加载
            if (document.querySelectorAll('.message-item').length === 0) {
                loadMessages();
            }
        } else {
            alert(res.message || '删除失败');
        }
    } catch (e) {
        alert('网络错误');
    }
}

async function adminBlockUser(userId) {
    if (!confirm('确定要拉黑该用户吗？拉黑后该用户将无法登录和发布内容。')) return;
    try {
        const res = await AdminAPI.blockUser(userId);
        if (res.code === 200) {
            alert('用户已被拉黑');
            const scrollY = window.scrollY;
            await loadMessages();
            window.scrollTo(0, scrollY);
        } else {
            alert(res.message || '操作失败');
        }
    } catch (e) {
        alert('网络错误');
    }
}

async function adminUnblockUser(userId) {
    if (!confirm('确定要解封该用户吗？解封后用户可以正常登录和发布内容。')) return;
    try {
        const res = await AdminAPI.unblockUser(userId);
        if (res.code === 200) {
            alert('用户已解封');
            const scrollY = window.scrollY;
            await loadMessages();
            window.scrollTo(0, scrollY);
        } else {
            alert(res.message || '操作失败');
        }
    } catch (e) {
        alert('网络错误');
    }
}

// ===== 修改密码 =====
function showChangePasswordModal() {
    const existing = document.getElementById('pwd-modal');
    if (existing) existing.remove();

    const modal = document.createElement('div');
    modal.id = 'pwd-modal';
    modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:flex;justify-content:center;align-items:center;backdrop-filter:blur(8px);';
    modal.innerHTML = `
        <div style="width:90%;max-width:380px;background:#14142c;border:1px solid rgba(201,168,76,0.2);border-radius:20px;padding:2rem;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
                <h3 style="font-family:'ZCOOL XiaoWei',serif;color:#fff;font-size:1.1rem;">🔑 修改密码</h3>
                <button onclick="document.getElementById('pwd-modal').remove()" style="width:28px;height:28px;border-radius:50%;border:1px solid rgba(201,168,76,0.15);background:transparent;color:#b0aca4;cursor:pointer;font-size:0.75rem;">✕</button>
            </div>
            <div style="margin-bottom:0.8rem;">
                <label style="display:block;font-size:0.72rem;color:#b0aca4;margin-bottom:4px;">原密码</label>
                <input type="password" id="pwd-old" placeholder="输入原密码" style="width:100%;padding:10px 14px;border-radius:12px;border:1px solid rgba(201,168,76,0.12);background:rgba(10,10,25,0.6);color:#e8e4dc;font-family:'LXGW WenKai',sans-serif;font-size:0.82rem;outline:none;">
            </div>
            <div style="margin-bottom:0.8rem;">
                <label style="display:block;font-size:0.72rem;color:#b0aca4;margin-bottom:4px;">新密码</label>
                <input type="password" id="pwd-new" placeholder="输入新密码（至少6位）" style="width:100%;padding:10px 14px;border-radius:12px;border:1px solid rgba(201,168,76,0.12);background:rgba(10,10,25,0.6);color:#e8e4dc;font-family:'LXGW WenKai',sans-serif;font-size:0.82rem;outline:none;">
            </div>
            <div style="margin-bottom:0.8rem;">
                <label style="display:block;font-size:0.72rem;color:#b0aca4;margin-bottom:4px;">确认新密码</label>
                <input type="password" id="pwd-confirm" placeholder="再次输入新密码" style="width:100%;padding:10px 14px;border-radius:12px;border:1px solid rgba(201,168,76,0.12);background:rgba(10,10,25,0.6);color:#e8e4dc;font-family:'LXGW WenKai',sans-serif;font-size:0.82rem;outline:none;">
            </div>
            <div id="pwd-error" style="display:none;margin-bottom:0.8rem;padding:6px 10px;border-radius:8px;background:rgba(224,96,80,0.1);border:1px solid rgba(224,96,80,0.2);color:#e06050;font-size:0.78rem;"></div>
            <button onclick="handleChangePassword()" style="width:100%;padding:10px;border-radius:12px;border:none;background:linear-gradient(135deg,#e0c868,#c89030);color:#0a0a10;font-family:'LXGW WenKai',sans-serif;font-size:0.85rem;font-weight:600;cursor:pointer;">确认修改</button>
        </div>
    `;
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
}

async function handleChangePassword() {
    const oldPwd = document.getElementById('pwd-old').value;
    const newPwd = document.getElementById('pwd-new').value;
    const confirmPwd = document.getElementById('pwd-confirm').value;
    const errorEl = document.getElementById('pwd-error');

    if (!oldPwd || !newPwd || !confirmPwd) {
        errorEl.textContent = '请填写所有密码字段';
        errorEl.style.display = 'block';
        return;
    }
    if (newPwd.length < 6) {
        errorEl.textContent = '新密码长度不能少于6个字符';
        errorEl.style.display = 'block';
        return;
    }
    if (newPwd !== confirmPwd) {
        errorEl.textContent = '两次输入的新密码不一致';
        errorEl.style.display = 'block';
        return;
    }

    try {
        const res = await AdminAPI.changePassword(oldPwd, newPwd);
        if (res.code === 200) {
            alert('密码修改成功！');
            document.getElementById('pwd-modal').remove();
        } else {
            errorEl.textContent = res.message || '修改失败，请重试';
            errorEl.style.display = 'block';
        }
    } catch (e) {
        errorEl.textContent = '网络错误，请重试';
        errorEl.style.display = 'block';
    }
}
</script>
</body>
